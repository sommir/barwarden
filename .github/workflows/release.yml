name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm install --global npm@11.6.2
      - run: npm ci --legacy-peer-deps
      - run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm run check:publication
      - run: cargo fetch --locked --manifest-path apps/menubar-tauri/src-tauri/Cargo.toml
      - run: npm run licenses:check
      - run: npm run test:release-policy
      - run: node --test scripts/create-updater-release-config.spec.mjs scripts/create-github-release-feed.spec.mjs
      - run: npm test
      - run: npm run build:web

  release:
    needs: verify
    runs-on: macos-14
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm install --global npm@11.6.2
      - run: npm ci --legacy-peer-deps
      - name: Build signed update artifacts
        env:
          BARWARDEN_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          BARWARDEN_UPDATER_PUBKEY: ${{ secrets.BARWARDEN_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          api_key_path="$RUNNER_TEMP/notary-api-key.p8"
          trap 'rm -f "$api_key_path"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          APPLE_API_KEY_PATH="$api_key_path" npm run tauri:build:update

          app_path="apps/menubar-tauri/src-tauri/target/release/bundle/macos/Barwarden.app"
          dmg_path="$(find apps/menubar-tauri/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -d "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$dmg_path"
          hdiutil verify "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl -a -vvv -t open --context context:primary-signature "$dmg_path"
      - name: Generate release feed
        run: |
          artifact=$(find apps/menubar-tauri/src-tauri/target/release/bundle -name '*.app.tar.gz' -print -quit)
          test -n "$artifact" && test -f "$artifact.sig"
          node scripts/create-github-release-feed.mjs "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$artifact" "$artifact.sig" latest.json
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            apps/menubar-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            apps/menubar-tauri/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/menubar-tauri/src-tauri/target/release/bundle/**/*.app.tar.gz.sig
            latest.json
