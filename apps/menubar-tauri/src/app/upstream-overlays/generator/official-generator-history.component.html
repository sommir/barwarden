<popup-page [attr.aria-busy]="loading$ | async">
  <popup-header slot="header" [pageTitle]="'generatorHistory' | i18n" showBackButton>
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
    </ng-container>
  </popup-header>
  @if (!(loading$ | async)) {
    <section class="macos-generator-history__content" data-testid="generator-history-content">
      <bit-empty-credential-history *ngIf="!(hasHistory$ | async)" style="display: contents" />
      <bit-credential-generator-history
        role="list"
        [account]="account$ | async"
        *ngIf="hasHistory$ | async"
      />
    </section>
  }
  @if (statusMessage$ | async; as statusMessage) {
    <bw-macos-alert-strip
      kind="danger"
      [title]="'i18nGeneratorHistoryFailed' | i18n"
      [message]="statusMessage"
    />
  }
  @if ((hasHistory$ | async) && !(loading$ | async)) {
    <popup-footer slot="footer">
      <button
        #clearTrigger
        class="macos-generator-history__clear-action"
        data-testid="generator-history-clear"
        [disabled]="clearing$ | async"
        bitButton
        type="submit"
        buttonType="primary"
        (click)="clear()"
      >
        {{ "clearHistory" | i18n }}
      </button>
    </popup-footer>
  }
  <bw-app-bottom-sheet
    #clearDialog
    labelledBy="generator-history-dialog-title"
    describedBy="generator-history-dialog-description"
    testId="generator-history-dialog"
    (dismissed)="cancelClear()"
  >
    <form class="app-bottom-sheet-panel">
      <header class="app-bottom-sheet-header">
        <h2 id="generator-history-dialog-title">
          {{ "clearGeneratorHistoryTitle" | i18n }}
        </h2>
      </header>
      <div class="app-bottom-sheet-body">
        <p id="generator-history-dialog-description">
          {{ "cleargGeneratorHistoryDescription" | i18n }}
        </p>
      </div>
      <footer class="app-bottom-sheet-footer">
        <button
          #clearCancel
          class="macos-generator-history__sheet-action"
          data-testid="generator-history-clear-cancel"
          bitButton
          buttonType="secondary"
          type="button"
          [disabled]="confirming || (clearing$ | async)"
          (click)="cancelClear()"
        >
          {{ "cancel" | i18n }}
        </button>
        <button
          class="macos-generator-history__sheet-action"
          data-testid="generator-history-clear-confirm"
          bitButton
          buttonType="danger"
          type="button"
          [disabled]="confirming || (clearing$ | async)"
          (click)="confirmClear()"
        >
          {{ "clearHistory" | i18n }}
        </button>
      </footer>
    </form>
  </bw-app-bottom-sheet>
</popup-page>
