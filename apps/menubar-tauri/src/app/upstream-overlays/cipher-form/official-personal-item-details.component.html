<section [formGroup]="itemDetailsForm" class="tw-mb-5 bit-compact:tw-mb-4 macos-form-section">
  <bit-section-header>
    <h2 bitTypography="h6">{{ "itemDetails" | i18n }}</h2>
    <button
      slot="end"
      type="button"
      size="small"
      class="macos-hit-target"
      [bitIconButton]="favoriteIcon"
      role="checkbox"
      [attr.aria-checked]="itemDetailsForm.value.favorite"
      [label]="'favorite' | i18n"
      (click)="toggleFavorite()"
      [disabled]="favoriteButtonDisabled"
    ></button>
  </bit-section-header>
  <bit-card class="macos-form-group">
    <bit-form-field class="macos-field-owner">
      <bit-label>{{ "itemName" | i18n }}</bit-label>
      <input class="macos-control-visible" bitInput formControlName="name" />
    </bit-form-field>
    <bit-form-field class="macos-field-owner" disableMargin>
      <bit-label>{{ "folder" | i18n }}</bit-label>
      <bit-select class="macos-control-visible" formControlName="folderId">
        @for (folder of config.folders; track folder.id) {
          <bit-option [value]="folder.id" [label]="folder.name"></bit-option>
        }
      </bit-select>
    </bit-form-field>
  </bit-card>
</section>
