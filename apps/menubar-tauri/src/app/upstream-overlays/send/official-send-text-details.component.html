<bit-section disableMargin>
  <bit-form-field class="macos-send-form__field">
    <bit-label>{{ "i18nTextToShare" | i18n }}</bit-label>
    <textarea bitInput id="send-text" rows="3" [value]="value().text" [readonly]="!editing()" [attr.aria-invalid]="touched().has('text') && errors().text ? 'true' : null" [attr.aria-describedby]="touched().has('text') && errors().text ? 'send-error-text' : null" (input)="valueChange.emit({ text: inputValue($event) })" (blur)="fieldBlur.emit('text')"></textarea>
    @if (touched().has("text") && errors().text) {
      <p id="send-error-text" data-testid="send-error-text" role="alert" class="macos-send-form__error">{{ "inputRequired" | i18n }}</p>
    }
  </bit-form-field>
  @if (showHiddenCheckbox()) {
    <bit-form-control>
      <input bitCheckbox type="checkbox" [checked]="value().hidden" [disabled]="!editing()" (change)="valueChange.emit({ hidden: checked($event) })" />
      <bit-label>{{ "i18nDefaultHideText" | i18n }}</bit-label>
    </bit-form-control>
  }
</bit-section>
