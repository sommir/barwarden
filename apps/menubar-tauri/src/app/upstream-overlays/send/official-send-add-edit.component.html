<popup-page>
  <popup-header slot="header" [pageTitle]="title" showBackButton [backAction]="backAction"></popup-header>

  @if (unavailable()) {
  <bit-callout type="info" [title]="'send' | i18n"><div role="status">{{ "i18nSendNotFound" | i18n }}</div></bit-callout>
  } @else {
    @if (status()) { <bit-callout type="info" [title]="'send' | i18n"><div role="status" data-testid="send-password-error">{{ status() }}</div></bit-callout> }
    <bw-official-send-details [editing]="editing()" [disabled]="disabled()" [originalHadPassword]="originalHadPassword()" [hideEmailAllowed]="hideEmailAllowed()" [value]="value()" [errors]="errors()" [touched]="touched()" (valueChange)="valueChange.emit($event)" (fieldBlur)="fieldBlur.emit($event)" (removePassword)="removePassword.emit()" (generatePassword)="generatePassword.emit()" (copyPassword)="copyPassword.emit($event)"></bw-official-send-details>
  }

  <popup-footer class="macos-form-actions" slot="footer">
    @if (!unavailable()) {
      @if (editing()) {
        <button class="macos-primary-action macos-button-owner" bitButton type="button" buttonType="primary" data-testid="save-send" [disabled]="disabled() || pending()" [attr.aria-busy]="pending() ? 'true' : null" (click)="save.emit()">{{ "save" | i18n }}</button>
        <button class="macos-secondary-action macos-hit-target" bitButton type="button" buttonType="secondary" data-testid="cancel-send-edit" [disabled]="pending()" (click)="cancel.emit()">{{ "cancel" | i18n }}</button>
      } @else {
        <button class="macos-secondary-action macos-hit-target" bitButton type="button" buttonType="secondary" data-testid="edit-send" (click)="edit.emit(); editingChange.emit(true)">{{ "i18nEdit" | i18n }}</button>
      }
      @if (mode() === 'edit') {
        <button class="tw-ml-auto macos-hit-target macos-send-form__icon-action" type="button" buttonType="dangerGhost" slot="end" bitIconButton="bwi-trash" [disabled]="pending()" (click)="delete.emit()"></button>
      }
    }
  </popup-footer>
</popup-page>
