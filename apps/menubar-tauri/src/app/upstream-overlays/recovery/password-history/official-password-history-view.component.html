@if (history && history.length) {
  <bit-item-group role="list">
    @for (h of history; track $index; let index = $index) {
      <bit-item>
        <div class="tw-pl-3 tw-py-2">
          <bit-color-password
            class="tw-text-base"
            [password]="h.password"
            [showCount]="false"
          ></bit-color-password>
          <div class="tw-text-sm tw-text-muted" [attr.data-testid]="'history-date-' + index">
            {{ formatDate(h.lastUsedDate) }}
          </div>
        </div>
        <ng-container slot="end">
          <bit-item-action>
            <button
              type="button"
              bitIconButton="bwi-clone"
              [attr.data-testid]="'history-copy-' + index"
              [label]="('copyPassword' | i18n) + ' ' + cipher.name"
              (click)="emitCopy(h)"
            ></button>
          </bit-item-action>
        </ng-container>
      </bit-item>
    }
  </bit-item-group>
}
@if (!history?.length) {
  <div
    class="tw-absolute tw-top-1/2 tw-left-1/2 tw-transform tw--translate-x-1/2 tw--translate-y-1/2 tw-text-center"
  >
    <p>{{ "i18nNoPasswords" | i18n }}</p>
  </div>
}
