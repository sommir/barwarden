<popup-page>
  <popup-header slot="header" [pageTitle]="'settings' | i18n">
    <ng-container slot="end">
      <ng-content select="[slot=end]" />
    </ng-container>
  </popup-header>

  <div class="tw-pt-4">
    @for (group of groups; track group.id) {
      <section class="macos-preference-group" [attr.aria-labelledby]="group.id + '-title'"
        [attr.data-settings-group]="group.id">
        <h2 class="settings-group__title" [id]="group.id + '-title'"
          [attr.data-settings-group-title]="group.id">{{ group.label }}</h2>
        <bit-item-group class="settings-group__items">
          @if (group.id === "general") {
            <bit-item>
              <div bit-item-content [truncate]="false" class="macos-preference-row" data-testid="launch-at-login-row">
                <span id="launch-at-login-label" class="macos-preference-row__copy">{{ "i18nLaunchAtLogin" | i18n }}</span>
                <button type="button" class="macos-switch-owner macos-hit-target" role="switch"
                  aria-labelledby="launch-at-login-label" [attr.aria-checked]="launchAtLoginEnabled"
                  [disabled]="launchAtLoginBusy"
                  (click)="requestLaunchAtLoginChange(!launchAtLoginEnabled)">
                  <span aria-hidden="true"></span>
                </button>
              </div>
            </bit-item>
          }
          @for (item of group.items; track item.route) {
            <bit-item>
              <button type="button" bit-item-content [truncate]="false" class="macos-preference-row macos-hit-target macos-pressable"
                [attr.data-settings-route]="item.route" (click)="navigate.emit(item.route)">
                <i slot="start" class="bwi" [class]="item.icon" aria-hidden="true"></i>
                <span class="macos-preference-row__copy">{{ item.label }}</span>
                <i slot="end" class="bwi bwi-angle-right macos-preference-row__value" aria-hidden="true"></i>
              </button>
            </bit-item>
          }
        </bit-item-group>
      </section>
    }

    @if (launchAtLoginError) {
      <bw-macos-alert-strip
        class="tw-mt-3"
        kind="danger"
        testId="launch-at-login-error"
        [title]="'i18nUnableToUpdateLaunchAtLoginTitle' | i18n"
        [message]="launchAtLoginError"
        [dismissible]="true"
        (dismiss)="dismissLaunchAtLoginError.emit()"
      />
    }
  </div>
</popup-page>
