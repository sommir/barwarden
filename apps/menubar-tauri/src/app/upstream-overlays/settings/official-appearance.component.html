<popup-page>
  <popup-header slot="header" [pageTitle]="'i18nAppearance' | i18n" showBackButton [backAction]="backAction" />

  <div
    class="settings-detail-group macos-continuous-group"
    data-settings-detail="appearance"
  >
    <bit-section>
      <bit-section-header>
        <h2 bitTypography="h6">{{ "i18nInterface" | i18n }}</h2>
      </bit-section-header>
      <bit-form-field class="settings-detail-row macos-continuous-row">
        <bit-label>{{ "i18nLanguage" | i18n }}</bit-label>
        <bit-select
          [attr.aria-label]="'i18nLanguage' | i18n"
          [items]="languageOptions"
          [ngModel]="language ?? ''"
          (ngModelChange)="setLanguageValue($event)"
        />
      </bit-form-field>
      <bit-form-field class="settings-detail-row macos-continuous-row">
        <bit-label>{{ "i18nTheme" | i18n }}</bit-label>
        <bit-select
          [attr.aria-label]="'i18nTheme' | i18n"
          [items]="themeOptions"
          [ngModel]="settings.theme"
          (ngModelChange)="setThemeValue($event)"
        />
      </bit-form-field>
      <bit-form-control class="settings-detail-row macos-continuous-row">
        <input
          bitCheckbox
          type="checkbox"
          [attr.aria-label]="'i18nCompactMode' | i18n"
          [checked]="settings.compactMode"
          (change)="emitChecked($event, compactModeChange)"
        />
        <bit-label>{{ "i18nCompactMode" | i18n }}</bit-label>
      </bit-form-control>
      <bit-form-control class="settings-detail-row macos-continuous-row" disableMargin>
        <input
          bitCheckbox
          type="checkbox"
          [attr.aria-label]="'i18nAnimations' | i18n"
          [checked]="settings.animations"
          (change)="emitChecked($event, animationsChange)"
        />
        <bit-label>{{ "i18nAnimations" | i18n }}</bit-label>
      </bit-form-control>
    </bit-section>

    <bit-section>
      <bit-section-header>
        <h2 bitTypography="h6">{{ "vault" | i18n }}</h2>
      </bit-section-header>
      <bit-form-control class="settings-detail-row macos-continuous-row">
        <input
          bitCheckbox
          type="checkbox"
          [attr.aria-label]="'i18nShowFavicons' | i18n"
          [checked]="settings.showFavicons"
          (change)="emitChecked($event, showFaviconsChange)"
        />
        <bit-label>{{ "i18nShowFavicons" | i18n }}</bit-label>
      </bit-form-control>
      <bit-form-control class="settings-detail-row macos-continuous-row" disableMargin>
        <input
          bitCheckbox
          type="checkbox"
          [attr.aria-label]="'i18nShowQuickCopyActions' | i18n"
          [checked]="settings.showQuickCopyActions"
          (change)="emitChecked($event, showQuickCopyActionsChange)"
        />
        <bit-label>{{ "i18nShowQuickCopyActions" | i18n }}</bit-label>
      </bit-form-control>
    </bit-section>
  </div>
</popup-page>
