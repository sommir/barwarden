<!-- Official Settings overlay source; generated. -->
<popup-page>
  <popup-header slot="header" pageTitle="{{ 'about' | i18n }}" showBackButton>
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
    </ng-container>
  </popup-header>

  <bit-item-group class="about-continuous-list macos-continuous-group">
    <bit-item>
      <button type="button" bit-item-content class="macos-continuous-row" (click)="troubleshoot()">
        {{ "troubleshooting" | i18n }}
      </button>
    </bit-item>
    <bit-item>
      <button type="button" bit-item-content class="macos-continuous-row" (click)="about()">
        {{ "aboutBitwarden" | i18n }}
      </button>
    </bit-item>
    <bit-item>
      <button type="button" bit-item-content class="macos-continuous-row" (click)="launchHelp()">
        {{ "helpCenter" | i18n }}
        <i slot="end" class="bwi bwi-external-link" aria-hidden="true"></i>
      </button>
    </bit-item>
    <bit-item>
      <button type="button" bit-item-content class="macos-continuous-row" (click)="openWebVault()">
        {{ "bitWebVaultApp" | i18n }}
        <i slot="end" class="bwi bwi-external-link" aria-hidden="true"></i>
      </button>
    </bit-item>
  </bit-item-group>
</popup-page>
