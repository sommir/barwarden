<!-- Official Settings overlay source; generated. -->
<popup-page>
  <popup-header slot="header" pageTitle="{{ 'settings' | i18n }}">
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
      <app-current-account></app-current-account>
    </ng-container>
  </popup-header>

  <div class="tw-px-4 tw-pt-4">
    <section class="settings-group" data-settings-group="general">
      <h2 bitTypography="h6" class="settings-group__title">{{ "general" | i18n }}</h2>
      <bit-item-group class="macos-continuous-group settings-group__items">
        <bit-item>
          <a bit-item-content class="settings-row macos-continuous-row" routerLink="/appearance" [truncate]="false">
            <i slot="start" class="bwi bwi-brush" aria-hidden="true"></i>
            {{ "appearance" | i18n }}
            <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
          </a>
        </bit-item>
      </bit-item-group>
    </section>

    <section class="settings-group" data-settings-group="security">
      <h2 bitTypography="h6" class="settings-group__title">{{ "security" | i18n }}</h2>
      <bit-item-group class="macos-continuous-group settings-group__items">
        <bit-item>
          <a bit-item-content class="settings-row macos-continuous-row" routerLink="/account-security" [truncate]="false">
            <i slot="start" class="bwi bwi-lock" aria-hidden="true"></i>
            {{ "accountSecurity" | i18n }}
            <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
          </a>
        </bit-item>
      </bit-item-group>
    </section>

    <section class="settings-group" data-settings-group="application">
      <h2 bitTypography="h6" class="settings-group__title">{{ "app" | i18n }}</h2>
      <bit-item-group class="macos-continuous-group settings-group__items">
        <bit-item>
          <a bit-item-content class="settings-row macos-continuous-row" routerLink="/vault-settings" [truncate]="false">
            <i slot="start" class="bwi bwi-vault" aria-hidden="true"></i>
            {{ "settingsVaultOptions" | i18n }}
            <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
          </a>
        </bit-item>
      </bit-item-group>
    </section>

    <section class="settings-group" data-settings-group="information">
      <h2 bitTypography="h6" class="settings-group__title">{{ "about" | i18n }}</h2>
      <bit-item-group class="macos-continuous-group settings-group__items">
        <bit-item>
          <a bit-item-content class="settings-row macos-continuous-row" routerLink="/about" [truncate]="false">
            <i slot="start" class="bwi bwi-info-circle" aria-hidden="true"></i>
            {{ "about" | i18n }}
            <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
          </a>
        </bit-item>
      </bit-item-group>
    </section>
  </div>
</popup-page>
