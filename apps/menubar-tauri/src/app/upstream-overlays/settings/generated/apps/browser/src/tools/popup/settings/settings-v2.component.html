<!-- Official Settings overlay source; generated. -->
<popup-page>
  <popup-header slot="header" pageTitle="{{ 'settings' | i18n }}">
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
      <app-current-account></app-current-account>
    </ng-container>
  </popup-header>

  <div class="tw-pt-4">
    <section class="macos-preference-group" aria-labelledby="general-title" data-settings-group="general">
      <h2 id="general-title" class="settings-group__title" data-settings-group-title="general">{{ "general" | i18n }}</h2>
      <bit-item-group class="settings-group__items">
        <bit-item>
          <a bit-item-content class="macos-preference-row macos-hit-target macos-pressable" data-settings-route="/appearance" routerLink="/appearance" [truncate]="false">
            <i slot="start" class="bwi bwi-brush" aria-hidden="true"></i>
            <span class="macos-preference-row__copy">{{ "appearance" | i18n }}</span>
            <i slot="end" class="bwi bwi-angle-right macos-preference-row__value" aria-hidden="true"></i>
          </a>
        </bit-item>
      </bit-item-group>
    </section>

    <section class="macos-preference-group" aria-labelledby="security-title" data-settings-group="security">
      <h2 id="security-title" class="settings-group__title" data-settings-group-title="security">{{ "security" | i18n }}</h2>
      <bit-item-group class="settings-group__items">
        <bit-item>
          <a bit-item-content class="macos-preference-row macos-hit-target macos-pressable" data-settings-route="/account-security" routerLink="/account-security" [truncate]="false">
            <i slot="start" class="bwi bwi-lock" aria-hidden="true"></i>
            <span class="macos-preference-row__copy">{{ "accountSecurity" | i18n }}</span>
            <i slot="end" class="bwi bwi-angle-right macos-preference-row__value" aria-hidden="true"></i>
          </a>
        </bit-item>
      </bit-item-group>
    </section>

    <section class="macos-preference-group" aria-labelledby="application-title" data-settings-group="application">
      <h2 id="application-title" class="settings-group__title" data-settings-group-title="application">{{ "app" | i18n }}</h2>
      <bit-item-group class="settings-group__items">
        <bit-item>
          <a bit-item-content class="macos-preference-row macos-hit-target macos-pressable" data-settings-route="/vault-settings" routerLink="/vault-settings" [truncate]="false">
            <i slot="start" class="bwi bwi-vault" aria-hidden="true"></i>
            <span class="macos-preference-row__copy">{{ "settingsVaultOptions" | i18n }}</span>
            <i slot="end" class="bwi bwi-angle-right macos-preference-row__value" aria-hidden="true"></i>
          </a>
        </bit-item>
      </bit-item-group>
    </section>

    <section class="macos-preference-group" aria-labelledby="information-title" data-settings-group="information">
      <h2 id="information-title" class="settings-group__title" data-settings-group-title="information">{{ "about" | i18n }}</h2>
      <bit-item-group class="settings-group__items">
        <bit-item>
          <a bit-item-content class="macos-preference-row macos-hit-target macos-pressable" data-settings-route="/about" routerLink="/about" [truncate]="false">
            <i slot="start" class="bwi bwi-info-circle" aria-hidden="true"></i>
            <span class="macos-preference-row__copy">{{ "about" | i18n }}</span>
            <i slot="end" class="bwi bwi-angle-right macos-preference-row__value" aria-hidden="true"></i>
          </a>
        </bit-item>
      </bit-item-group>
    </section>
  </div>
</popup-page>
