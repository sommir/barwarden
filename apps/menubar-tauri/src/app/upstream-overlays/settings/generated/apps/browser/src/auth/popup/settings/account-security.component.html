<!-- Official Settings overlay source; generated. -->
<popup-page>
  <popup-header slot="header" pageTitle="{{ 'accountSecurity' | i18n }}" showBackButton>
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
    </ng-container>
  </popup-header>

  <bit-section>
    <bit-section-header>
      <h2 bitTypography="h6">{{ "sessionTimeoutHeader" | i18n }}</h2>
    </bit-section-header>
    <bit-card>
      <bit-session-timeout-settings [refreshTimeoutActionSettings]="refreshTimeoutSettings$" />
    </bit-card>
  </bit-section>

  <bit-section disableMargin>
    <bit-section-header>
      <h2 bitTypography="h6">{{ "otherOptions" | i18n }}</h2>
    </bit-section-header>
    <bit-item>
      <button bit-item-content type="button" appStopClick (click)="openAcctFingerprintDialog()">
        {{ "fingerprintPhrase" | i18n }}
      </button>
    </bit-item>
    <bit-item>
      <button bit-item-content type="button" appStopClick (click)="twoStep()">
        {{ "twoStepLogin" | i18n }}
        <bit-icon slot="end" name="bwi-external-link"></bit-icon>
      </button>
    </bit-item>
    <bit-item>
      <button bit-item-content type="button" appStopClick (click)="changePassword()">
        {{ "changeMasterPassword" | i18n }}
        <bit-icon slot="end" name="bwi-external-link"></bit-icon>
      </button>
    </bit-item>
  </bit-section>
</popup-page>
