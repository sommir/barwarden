<!-- Official Settings overlay source; generated. -->
<popup-page>
  <popup-header slot="header" pageTitle="{{ 'accountSecurity' | i18n }}" showBackButton>
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
    </ng-container>
  </popup-header>

  <div
    class="settings-detail-group macos-continuous-group"
    data-settings-detail="account-security"
  >
    <bit-section>
      <bit-section-header>
        <h2 bitTypography="h6">{{ "sessionTimeoutHeader" | i18n }}</h2>
      </bit-section-header>
      <bit-session-timeout-settings
        class="settings-detail-row macos-continuous-row"
        [refreshTimeoutActionSettings]="refreshTimeoutSettings$"
      />
    </bit-section>

    <bit-section disableMargin>
      <bit-section-header>
        <h2 bitTypography="h6">{{ "otherOptions" | i18n }}</h2>
      </bit-section-header>
      <bit-item>
        <button
          bit-item-content
          type="button"
          class="settings-detail-row macos-continuous-row"
          appStopClick
          (click)="openAcctFingerprintDialog()"
        >
          {{ "fingerprintPhrase" | i18n }}
        </button>
      </bit-item>
      <bit-item>
        <button
          bit-item-content
          type="button"
          class="settings-detail-row macos-continuous-row"
          appStopClick
          (click)="twoStep()"
        >
          {{ "twoStepLogin" | i18n }}
          <bit-icon slot="end" name="bwi-external-link"></bit-icon>
        </button>
      </bit-item>
      <bit-item>
        <button
          bit-item-content
          type="button"
          class="settings-detail-row macos-continuous-row"
          appStopClick
          (click)="changePassword()"
        >
          {{ "changeMasterPassword" | i18n }}
          <bit-icon slot="end" name="bwi-external-link"></bit-icon>
        </button>
      </bit-item>
    </bit-section>
  </div>
</popup-page>
