<!-- Official Settings overlay source; generated. -->
<popup-page [loading]="formLoading">
  <popup-header slot="header" [pageTitle]="'appearance' | i18n" showBackButton>
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
    </ng-container>
  </popup-header>

  <form
    class="settings-detail-group macos-continuous-group"
    data-settings-detail="appearance"
    [formGroup]="appearanceForm"
  >
    <bit-form-field class="settings-detail-row macos-continuous-row">
      <bit-label>{{ "theme" | i18n }}</bit-label>
      <bit-select formControlName="theme">
        @for (o of themeOptions; track o.value) {
          <bit-option [value]="o.value" [label]="o.name"></bit-option>
        }
      </bit-select>
    </bit-form-field>

    <bit-form-control class="settings-detail-row macos-continuous-row">
      <input bitCheckbox formControlName="enableCompactMode" type="checkbox" />
      <bit-label>{{ "compactMode" | i18n }}</bit-label>
    </bit-form-control>

    <bit-form-control class="settings-detail-row macos-continuous-row" disableMargin>
      <input bitCheckbox formControlName="enableAnimations" type="checkbox" />
      <bit-label>{{ "showAnimations" | i18n }}</bit-label>
    </bit-form-control>
    <h2 bitTypography="h6" class="tw-font-medium tw-mt-4">{{ "vaultCustomization" | i18n }}</h2>
    <bit-form-control class="settings-detail-row macos-continuous-row">
      <input bitCheckbox formControlName="enableFavicon" type="checkbox" />
      <bit-label>
        {{ "showIconsChangePasswordUrls" | i18n }}
        <vault-permit-cipher-details-popover></vault-permit-cipher-details-popover>
      </bit-label>
    </bit-form-control>
    <bit-form-control class="settings-detail-row macos-continuous-row" disableMargin>
      <input bitCheckbox formControlName="showQuickCopyActions" type="checkbox" />
      <bit-label>{{ "showQuickCopyActions" | i18n }}</bit-label>
    </bit-form-control>
  </form>
</popup-page>
