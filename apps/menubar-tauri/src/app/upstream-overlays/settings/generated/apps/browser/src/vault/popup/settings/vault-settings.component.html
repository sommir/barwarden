<!-- Official Settings overlay source; generated. -->
<popup-page>
  <popup-header slot="header" [pageTitle]="'settingsVaultOptions' | i18n" showBackButton>
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
    </ng-container>
  </popup-header>

  <bit-item-group
    class="settings-detail-group macos-preference-group"
    data-settings-detail="vault-settings"
  >
    <bit-item>
      <a
        bit-item-content
        [truncate]="false"
        class="settings-detail-row macos-preference-row"
        data-popup-focus-key="settings:folders"
        routerLink="/folders"
      >
        {{ "folders" | i18n }}
        <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
      </a>
    </bit-item>
    <bit-item>
      <a
        bit-item-content
        [truncate]="false"
        class="settings-detail-row macos-preference-row"
        data-test-id="archive-link"
        data-popup-focus-key="settings:archive"
        routerLink="/archive"
      >
        {{ "archiveNoun" | i18n }}
        <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
      </a>
    </bit-item>
    <bit-item>
      <a
        bit-item-content
        [truncate]="false"
        class="settings-detail-row macos-preference-row"
        data-popup-focus-key="settings:trash"
        routerLink="/trash"
      >
        {{ "trash" | i18n }}
        <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
      </a>
    </bit-item>
    <bit-item>
      <button
        type="button"
        bit-item-content
        [truncate]="false"
        class="settings-detail-row macos-preference-row"
        data-testid="vault-sync-row"
        [disabled]="syncLoading"
        [attr.aria-busy]="syncLoading"
        (click)="sync()"
      >
        {{ "syncNow" | i18n }}
        <span slot="secondary">{{ lastSync }}</span>
        <span slot="end">
          @if (syncLoading) {
            <bit-spinner size="sm"></bit-spinner>
          } @else {
            <i class="bwi bwi-refresh" aria-hidden="true"></i>
          }
        </span>
      </button>
    </bit-item>
  </bit-item-group>
</popup-page>
