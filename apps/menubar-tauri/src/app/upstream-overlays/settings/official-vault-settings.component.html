<popup-page>
  <popup-header slot="header" [pageTitle]="'i18nVaultOptions' | i18n" showBackButton [backAction]="backAction" />

  <bit-item-group
    class="settings-detail-group macos-continuous-group"
    data-settings-detail="vault-settings"
  >
    <bit-item>
      <button
        type="button"
        bit-item-content
        class="settings-detail-row macos-continuous-row"
        data-popup-focus-key="settings:folders"
        (click)="navigate.emit('/folders')"
      >
        {{ "folders" | i18n }}
        <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
      </button>
    </bit-item>
    <bit-item>
      <button
        type="button"
        bit-item-content
        class="settings-detail-row macos-continuous-row"
        data-test-id="archive-link"
        data-popup-focus-key="settings:archive"
        (click)="navigate.emit('/archive')"
      >
        {{ "archive" | i18n }}
        <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
      </button>
    </bit-item>
    <bit-item>
      <button
        type="button"
        bit-item-content
        class="settings-detail-row macos-continuous-row"
        data-popup-focus-key="settings:trash"
        (click)="navigate.emit('/trash')"
      >
        {{ "trash" | i18n }}
        <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
      </button>
    </bit-item>
    <bit-item>
      <button
        type="button"
        bit-item-content
        class="settings-detail-row macos-continuous-row"
        data-testid="vault-sync-row"
        [disabled]="isSyncing"
        [attr.aria-busy]="isSyncing"
        (click)="sync.emit()"
      >
        {{ "syncNow" | i18n }}
        <span slot="secondary">{{ syncLabel }}</span>
        <span slot="end">
          <i
            class="bwi"
            [class.bwi-spinner]="isSyncing"
            [class.bwi-spin]="isSyncing"
            [class.bwi-refresh]="!isSyncing"
            aria-hidden="true"
          ></i>
        </span>
      </button>
    </bit-item>
  </bit-item-group>

  @if (syncError) {
    <bw-macos-alert-strip
      kind="danger"
      [title]="'i18nSyncVaultFailed' | i18n"
      [message]="syncError"
      [actionLabel]="'i18nRetry' | i18n"
      (action)="sync.emit()"
    />
  }
</popup-page>
