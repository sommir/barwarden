<section class="tw-mb-5 bit-compact:tw-mb-4">
  <bit-section-header>
    <h2 bitTypography="h6">{{ "autofillOptions" | i18n }}</h2>
  </bit-section-header>
  <bit-card>
    @for (login of projection.cipher.login.uris; track $index; let last = $last; let i = $index) {
      <bit-form-field [disableMargin]="last" data-testid="autofill-view-list">
        <bit-label>{{ "website" | i18n }}</bit-label>
        <input
          readonly
          bitInput
          type="text"
          [value]="login.hostOrUri"
          aria-readonly="true"
          data-testid="login-website"
        />
        <button
          bitIconButton="bwi-external-link"
          bitSuffix
          type="button"
          data-testid="launch-website"
          [label]="('launch' | i18n) + ' ' + login.hostOrUri"
          (click)="launchUri.emit(login.launchUri || login.uri || '')"
        ></button>
        <button
          bitIconButton="bwi-clone"
          bitSuffix
          type="button"
          [label]="'copyWebsite' | i18n"
          data-testid="copy-website"
          (click)="copyField.emit(uriField(i))"
        ></button>
      </bit-form-field>
    }
  </bit-card>
</section>
