<form [bitSubmit]="submit" [formGroup]="formGroup" class="macos-auth-card">
  <!-- <ng-template> must be within the <form> to ensure that `formControlName` has a parent `formGroup` directive. -->
  <ng-template #formContentTemplate>
    <bit-form-field class="macos-field-owner">
      <bit-label>{{ "accountEmail" | i18n }}</bit-label>
      <input
        bitInput
        class="macos-control-visible"
        appAutofocus
        inputmode="email"
        type="email"
        formControlName="email"
      />
    </bit-form-field>

    <button
      class="tw-mb-2 macos-primary-action macos-button-owner"
      type="submit"
      bitButton
      bitFormButton
      buttonType="primary"
      [block]="true"
    >
      {{ "requestHint" | i18n }}
    </button>
    <div class="macos-auth-alternatives">
      <button
        type="button"
        bitButton
        buttonType="secondary"
        class="macos-auth-alternative macos-hit-target macos-pressable"
        (click)="cancel()"
        [block]="true"
      >
        {{ "cancel" | i18n }}
      </button>
    </div>
  </ng-template>

  <ng-container *ngTemplateOutlet="formContentTemplate"></ng-container>
</form>
