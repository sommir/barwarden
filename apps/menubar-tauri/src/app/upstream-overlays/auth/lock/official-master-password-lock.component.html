<form [formGroup]="formGroup" [bitSubmit]="submit" class="macos-auth-card">
  <bit-form-field class="macos-field">
    <bit-label>{{ "masterPass" | i18n }}</bit-label>
    <input
      [type]="showPassword ? 'text' : 'password'"
      formControlName="masterPassword"
      bitInput
      appAutofocus
      name="masterPassword"
      class="tw-font-mono"
      required
      appInputVerbatim
      autocomplete="current-password"
      data-testid="lock-master-password-input"
      (input)="dismissUnlockError()"
    />
    <button
      type="button"
      [bitIconButton]="showPassword ? 'bwi-eye-slash' : 'bwi-eye'"
      bitSuffix
      (click)="togglePasswordVisibility()"
      [attr.aria-label]="passwordVisibilityLabel"
      [attr.title]="passwordVisibilityLabel"
      data-testid="lock-password-visibility"
    ></button>
  </bit-form-field>

  <div class="macos-auth-validation macos-auth-validation--field">
    @if (unlockFailed) {
      <bit-callout
        type="danger"
        [title]="null"
        data-testid="lock-unlock-error"
        (dismiss)="dismissUnlockError()"
      >
        <p bitTypography="body1" role="alert">{{ unlockErrorMessage }}</p>
      </bit-callout>
    }
  </div>

  <div class="macos-unlock-methods" data-testid="lock-unlock-methods">
    <button
      type="submit"
      bitButton
      bitFormButton
      buttonType="primary"
      class="macos-primary-action macos-button-owner"
      block
      [disabled]="submitting"
      data-testid="lock-unlock-button"
    >
      {{ "unlock" | i18n }}
    </button>

    @if (showBiometric || showPin) {
      <p class="tw-text-center">{{ "or" | i18n }}</p>
    }

    @if (showBiometric) {
      <button
        type="button"
        bitButton
        bitFormButton
        buttonType="secondary"
        class="macos-auth-alternative macos-hit-target macos-pressable"
        block
        [disabled]="submitting"
        (click)="selectMethod('biometric')"
        data-testid="lock-switch-biometric"
      >
        {{ "i18nUseTouchId" | i18n }}
      </button>
    }

    @if (showPin) {
      <button
        type="button"
        bitButton
        bitFormButton
        buttonType="secondary"
        class="macos-auth-alternative macos-hit-target macos-pressable"
        block
        [disabled]="submitting"
        (click)="selectMethod('pin')"
        data-testid="lock-switch-pin"
      >
        {{ "i18nUsePin" | i18n }}
      </button>
    }

    <button
      type="button"
      bitButton
      bitFormButton
      class="macos-auth-alternative macos-hit-target macos-pressable macos-danger-action"
      block
      [disabled]="submitting"
      (click)="logout()"
      data-testid="lock-logout-button"
    >
      {{ "logOut" | i18n }}
    </button>

    <ng-content />
  </div>
</form>
