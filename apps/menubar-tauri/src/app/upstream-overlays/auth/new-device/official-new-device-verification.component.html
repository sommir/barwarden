<form [formGroup]="formGroup" [bitSubmit]="submit" class="macos-auth-card">
  <bit-form-field class="!tw-mb-1 macos-field macos-field-owner">
    <bit-label>{{ "verificationCode" | i18n }}</bit-label>
    <input
      bitInput
      class="macos-control-visible"
      type="text"
      id="verificationCode"
      name="verificationCode"
      formControlName="code"
      autocomplete="one-time-code"
      (paste)="onPaste($event)"
    />
  </bit-form-field>

  <div class="macos-auth-validation">
    <bit-callout *ngIf="loginError" type="danger" data-testid="new-device-error">
      <p bitTypography="body1" role="alert">{{ loginError }}</p>
    </bit-callout>
  </div>

  <div class="macos-auth-alternatives">
    <button
      bitLink
      type="button"
      linkType="primary"
      data-testid="new-device-resend"
      (click)="resendOTP()"
      [disabled]="disableRequestOTP"
      class="tw-text-sm macos-auth-alternative macos-hit-target macos-pressable"
    >
      {{ "resendCode" | i18n }}
    </button>
  </div>

  <div class="tw-grid tw-gap-3 tw-mt-4">
    <button
      bitButton
      bitFormButton
      buttonType="primary"
      class="macos-primary-action macos-button-owner"
      type="submit"
      [block]="true"
      data-testid="new-device-continue"
      [disabled]="formGroup.invalid || store.snapshot().isLoggingIn || disableRequestOTP"
    >
      {{ "continueLoggingIn" | i18n }}
    </button>
  </div>
</form>
