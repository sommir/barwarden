<popup-page [loading]="loading">
  <popup-header slot="header" pageTitle="{{ 'accountActions' | i18n }}" showBackButton>
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
      <app-current-account></app-current-account>
    </ng-container>
  </popup-header>

  <bit-callout *ngIf="error$ | async as error" type="danger">
    <p bitTypography="body1" role="alert">{{ error }}</p>
  </bit-callout>

  <ng-container *ngIf="availableAccounts$ | async as availableAccounts">
    <bit-section [disableMargin]="!(enableAccountSwitching$ | async)">
      <ng-container *ngFor="let availableAccount of availableAccounts; first as isFirst">
        <div
          *ngIf="availableAccount.isActive"
          [ngClass]="{ 'tw-mb-6': enableAccountSwitching$ | async }"
        >
          <auth-account [account]="availableAccount"></auth-account>
        </div>

        <ng-container *ngIf="enableAccountSwitching$ | async">
          <bit-section-header *ngIf="isFirst">
            <h2 bitTypography="h6">{{ "availableAccounts" | i18n }}</h2>
          </bit-section-header>

          <div *ngIf="!availableAccount.isActive">
            <auth-account [account]="availableAccount"></auth-account>
          </div>
        </ng-container>
      </ng-container>

      <!--
          If the user has not reached the account limit, the last 'availableAccount' will have an 'id' of
          'SPECIAL_ADD_ACCOUNT_ID'. Since we don't want to count this as one of the actual accounts,
          we check to make sure the 'id' of the last 'availableAccount' is not equal to 'SPECIAL_ADD_ACCOUNT_ID'
      -->
      <p
        class="tw-text-sm tw-text-muted"
        *ngIf="
          availableAccounts.length >= accountLimit &&
          availableAccounts[availableAccounts.length - 1].id !== specialAddAccountId
        "
      >
        {{ "accountLimitReached" | i18n }}
      </p>
    </bit-section>
  </ng-container>

  <div *ngIf="currentAccount$ | async as currentAccount">
    <bit-callout
      *ngIf="(currentAuthorization$ | async) === 'recovery-required'"
      type="warning"
      urgency="assertive"
    >
      <p role="status">{{ "i18nSessionRestoreStatus" | i18n }}</p>
      <button type="button" bitButton buttonType="secondary" class="macos-hit-target" (click)="recover(currentAccount.id)">
        {{ "i18nRetrySession" | i18n }}
      </button>
    </bit-callout>
    <bit-section>
      <bit-section-header>
        <h2 bitTypography="h6">{{ "options" | i18n }}</h2>
      </bit-section-header>

      <bit-item>
        <button
          type="button"
          bit-item-content
          class="macos-hit-target"
          (click)="lock(currentAccount.id)"
          [disabled]="(currentAuthorization$ | async) !== 'unlocked' || !activeUserCanLock"
          [title]="!activeUserCanLock ? ('unlockMethodNeeded' | i18n) : ''"
        >
          <bit-icon slot="start" name="bwi-lock" class="tw-text-lg tw-text-main"></bit-icon>
          {{ "lockNow" | i18n }}
        </button>
      </bit-item>
      <bit-item>
        <button type="button" bit-item-content class="macos-hit-target" (click)="logOut(currentAccount.id)">
          <bit-icon slot="start" name="bwi-sign-out" class="tw-text-lg tw-text-main"></bit-icon>
          {{ "logOut" | i18n }}
        </button>
      </bit-item>
      <bit-item *ngIf="showLockAll$ | async">
        <button type="button" bit-item-content class="macos-hit-target" (click)="lockAll()">
          <bit-icon slot="start" name="bwi-lock" class="tw-text-lg tw-text-main"></bit-icon>
          {{ "lockAll" | i18n }}
        </button>
      </bit-item>
    </bit-section>
  </div>
</popup-page>
