<ng-container>
  <bit-form-field class="macos-field-owner">
    <bit-label>{{ "verificationCode" | i18n }}</bit-label>
    <input
      bitInput
      class="macos-control-visible"
      type="text"
      appAutofocus
      appInputVerbatim
      [formControl]="tokenFormControl"
      (keyup)="onTokenChange($event)"
      (paste)="onPaste($event)"
    />
  </bit-form-field>
</ng-container>
