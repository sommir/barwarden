<bit-form-field class="!tw-mb-0 macos-field-owner">
  <bit-label>{{ "verificationCode" | i18n }}</bit-label>
  <input
    bitInput
    class="macos-control-visible"
    type="text"
    appAutofocus
    appInputVerbatim
    [formControl]="tokenFormControl"
    (keyup)="onTokenChange($event)"
    (paste)="onPaste($event)"
  />
</bit-form-field>

<div class="tw-mb-4">
  <a
    bitTypography="helper"
    class="tw-text-main macos-auth-alternative macos-hit-target macos-pressable"
    bitLink
    href="#"
    appStopClick
    data-testid="two-factor-email-resend"
    (click)="sendEmail(true)"
  >
    {{ "resendCode" | i18n }}
  </a>
</div>
